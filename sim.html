<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<title>SpaDu | Space Education</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="sim.css">

</head>

<body>

<div id="hud">
🌌 Space Education<br>
🌍 By PiyXoX Developer From Indonesia<br>
🚀 Educating To Public About Astronomy
</div>

<div id="infoPanel">
<img id="infoImage">

<h3 id="infoTitle">Object</h3>
<p id="infoDesc"></p>
<p id="infoSize"></p>
<p id="infoType"></p>
<button onclick="closeInfo()">❌ Close</button>
</div>

<div id="controls">

Time Speed<br> <input type="range" id="timeScale" min="0.1" max="10" step="0.1" value="1"><br><br>

<button id="telescopeBtn">🔭 Telescope Mode</button><br> <button id="freeBtn">🚀 Free Fly Mode</button><br><br>

<button id="openTeleport">🧭 Teleport</button><br><br>

<button onclick="playMusic()">▶️ Play Music</button> <button onclick="pauseMusic()">⏸️ Pause Music</button>

<div id="teleportPanel">

<h3>🧭 Teleport Menu</h3>

<button id="tpEarth">🌍 Earth</button> <button id="tpMoon">🌕 Moon</button> <button id="tpOrion">🌌 Orion</button> <button id="tpBlackHole">🕳️ Black Hole</button> <button id="tpPleiades">🌟 Pleiades</button>

<hr>

<button id="closeTeleport">❌ Close</button>

</div>

</div>

<div id="mobileControls">

<div class="pad">

<button data-dir="forward">▲</button>

<div>
<button data-dir="left">◀</button>
<button data-dir="back">▼</button>
<button data-dir="right">▶</button>
</div>

</div>

<div class="updown">

<button data-dir="up">⤒</button> <button data-dir="down">⤓</button>

</div>

</div>

<div id="player"></div>

<!-- THREE JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/FlyControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- LOADING SCREEN -->

<div id="loadingScreen">
<div class="loader"></div>
<div id="loadingText">Initializing Universe...</div>
</div>

<!-- INTRO SCREEN -->

<div id="introScreen">
<h1>DEEP SPACE VIEW</h1>
<p>Explore the universe beyond imagination</p>
<button id="startBtn">START EXPLORATION</button>
</div>

<!-- YouTube API -->

<script src="https://www.youtube.com/iframe_api"></script>
<script src="sim.js"></script>

</body>
</html>
