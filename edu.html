<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<title>Educational Mode | SpaDu</title>

<style>

body{
margin:0;
background:black;
color:#0ff;
font-family:monospace;
text-align:center;
padding:40px;
}

h1{
text-shadow:0 0 10px cyan,0 0 20px cyan;
}

#cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:30px;
}

.card{
background:rgba(0,255,255,0.05);
border:1px solid cyan;
border-radius:12px;
width:220px;
padding:15px;
transition:0.3s;
}

.card img{
width:100%;
height:130px;
object-fit:cover;
border-radius:8px;
margin-bottom:10px;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 20px cyan;
}

button{
margin-top:40px;
width:240px;
height:40px;
border:1px solid cyan;
background:transparent;
color:cyan;
font-family:monospace;
cursor:pointer;
border-radius:10px;
}

button:hover{
background:cyan;
color:black;
}

</style>

</head>

<body>

<h1>Educational Mode</h1>

<p>Klik kartu untuk belajar objek astronomi</p>

<div id="cards"></div>

<button onclick="location.href='index.html'">
Kembali ke Menu
</button>

<script>

const objects=[

{
title:"Mercury",
img:"https://upload.wikimedia.org/wikipedia/commons/4/4a/Mercury_in_true_color.jpg",
desc:"Planet terdekat dari Matahari."
},

{
title:"Venus",
img:"https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg",
desc:"Planet dengan atmosfer sangat tebal."
},

{
title:"Earth",
img:"https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg",
desc:"Planet tempat kita hidup."
},

{
title:"Mars",
img:"https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg",
desc:"Planet merah."
},

{
title:"Jupiter",
img:"https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg",
desc:"Planet terbesar di Tata Surya."
},

{
title:"Saturn",
img:"https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg",
desc:"Planet dengan cincin indah."
},

{
title:"Milky Way",
img:"https://apod.nasa.gov/apod/image/1901/MilkyWay_Okada_960.jpg",
desc:"Galaksi tempat Bumi berada."
},

{
title:"Andromeda",
img:"https://apod.nasa.gov/apod/image/1901/AndromedaGalaxy.jpg",
desc:"Galaksi spiral terdekat."
}

];

const container=document.getElementById("cards");

objects.forEach(o=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<img src="${o.img}">
<h3>${o.title}</h3>
<p>${o.desc}</p>
`;

container.appendChild(card);

});

</script>

</body>
</html>
